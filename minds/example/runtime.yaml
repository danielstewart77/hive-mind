# Example mind — self-contained runtime configuration.
# Copy this folder to minds/<your-mind>/ and edit; identity / soul prose
# lives in the knowledge graph, not here.

name: example
mind_id: example
gateway_url: http://example:8420
remote: false
description: "Example — starter mind, Claude CLI, Anthropic-backed."

harness: claude_cli
provider: anthropic
default_model: claude-sonnet-5
runtime_config_dir: /usr/src/app/minds/example/.claude
resume_policy: always

# What the default model above actually holds. Required on a dsh_cli mind,
# whose provider route lists no models and sizes every one of them from this:
# compaction reads it as the ceiling, so a mind without it is refused rather
# than run behind a capacity nobody picked.
context_window: 200000

startup:
  skip_host_credentials: false
  sync_repo_config: true

transport:
  type: cli_stream_json
