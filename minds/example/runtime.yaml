# Example mind — self-contained runtime configuration.
# Copy this folder to minds/<your-mind>/ and edit; identity / soul prose
# lives in the knowledge graph, not here.

name: example
mind_id: example
# The user this mind belongs to: their lowercase username on the hive
# console. Every mind has exactly one owner, and comms refuses to register a
# mind it has never seen that names none. Once registered, only an admin can
# move a mind to another owner; naming a different one here is refused.
owner:
gateway_url: http://example:8420
remote: false
description: "Example — starter mind, Claude CLI, Anthropic-backed."

# The harness a new conversation starts on: claude, codex or dsh. Every
# harness runs in this mind's one server, and a conversation can be switched
# between them; this is only where one begins.
harness: claude
provider: anthropic
default_model: claude-sonnet-5
runtime_config_dir: /usr/src/app/minds/example/.claude
resume_policy: always

# Which voice this mind is spoken in. A Kokoro voice name; the voice server
# reads it from the broker row, which this file is the truth for. Unset means
# the voice server's own default.
voice:

startup:
  skip_host_credentials: false
  sync_repo_config: true

transport:
  type: cli_stream_json

# The rotation threshold. A file with no line means 100, which is no early
# rotation at all, so a new mind starts with one: thirty, Daniel 2026-11-17,
# "for now". The mind's Settings card on the console changes it. The figure
# for new minds is also written in, and changes together with:
#   NEW_MIND_ROTATION_THRESHOLD_PERCENT in installer/steps.py (this repo)
#   NEW_MIND_ROTATION_THRESHOLD_PERCENT in hive, src/configuration_data.py
#   NEW_MIND_ROTATION_THRESHOLD_PERCENT in hive-edge-minds setup.sh, and
#     that repo's minds/example/runtime.yaml and README.md
#   docs/multi-mind-architecture.md (this repo)
#   the create-mind and add-mind skills in the hivemind plugin
#
# Percentage of the conversation model's context window at which
# the next safe check may begin the existing handover.
rotation_threshold_percent: 30
