services:
  example:
    build:
      context: ../../..
    container_name: hive-mind-example
    init: true
    working_dir: /usr/src/app
    environment:
      - MIND_NAME=example
      # Where this checkout is mounted. Repo-shipped skills resolve repo
      # content (data-class specs, stateless tools) through this rather
      # than a path baked in when the skill was written.
      - HIVE_PROJECT_DIR=/usr/src/app
      - CLAUDE_CONFIG_DIR=/home/hivemind/.claude-config
      - COMMS_URL=http://hive-comms:8424
      # A mind re-registers from its own runtime.yaml on every start, and
      # POST /broker/minds is an admin route.
      - COMMS_ADMIN_BEARER_TOKEN=${COMMS_ADMIN_BEARER_TOKEN}
      - PYTHON_KEYRING_BACKEND=core.keyring_backend.HiveMindKeyring
      # Which keyring entry holds this mind's Telegram token. The mind's own
      # surface container names the same key; a backend that named none would
      # read the ambient environment instead and report no token stored while
      # its bot authenticated off the keyring beside it.
      - TELEGRAM_BOT_TOKEN_KEYRING_KEY=EXAMPLE_TELEGRAM_BOT_TOKEN
      - PYTHONNOUSERSITE=1
      - PYTHONPATH=/usr/src/app/vendor
      - KEY_RING=/usr/src/app/data/keyring
      # This mind's own GitHub token, under a name no other mind uses.
      # Every mind here resolves the same keyring file, separated only by
      # key name, so a mind falling back to the default would store its
      # token over another's and both would read as working and wrong.
      - GITHUB_TOKEN_KEYRING_KEY=EXAMPLE_GITHUB_TOKEN
      # This mind's home is image layers nothing else reads and a rebuild
      # deletes, so writing `git` and `gh`'s own files there is its own
      # business. An edge mind shares a home with the person who owns the
      # machine and must never be given this.
      - GITHUB_TOKEN_CONFIGURES_TOOLS=1
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/usr/src/app:rw
      - ${HOST_CLAUDE_DIR:-~/.claude}:/home/hivemind/.host-claude:ro
      - ${HOST_PROJECT_DIR:-.}/minds/example/.claude:/home/hivemind/.claude-config:rw
    restart: unless-stopped
    networks:
      - hivemind
    tmpfs:
      - /tmp
    command: ["/opt/venv/bin/python3", "-m", "minds.harness.claude_cli"]
