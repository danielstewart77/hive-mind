services:
  example:
    build:
      context: ../../..
      additional_contexts:
        hive_surfaces: ../../../modules/hive-surfaces
    container_name: hive-mind-example
    init: true
    working_dir: /usr/src/app
    environment:
      - MIND_NAME=example
      # Where this checkout is mounted. Repo-shipped skills resolve repo
      # content (data-class specs, stateless tools) through this rather
      # than a path baked in when the skill was written.
      - HIVE_PROJECT_DIR=/usr/src/app
      - CLAUDE_CONFIG_DIR=/home/hivemind/.claude-config
      - COMMS_URL=http://hive-comms:8424
      # This mind's one key, the value its owner pasted when it was made, is a
      # FILE in a folder of its own (mounted read-only below, outside this
      # checkout): the mind reads it at each request and sets every per-service
      # name its harnesses and hooks read from it, so a replaced key needs no
      # restart. A mind with no key file started on the per-service values it
      # had before (the transition).
      - MIND_KEY_FILE=/run/mind-key/key
      # A mind re-registers from its own runtime.yaml on every start with its
      # own key; the gateway accepts that for its own row. No hive-wide
      # administrator key is ever given to a mind.
      - PYTHON_KEYRING_BACKEND=core.keyring_backend.HiveMindKeyring
      # Which keyring entry holds this mind's Telegram token. The mind's own
      # surface container names the same key; a backend that named none would
      # read the ambient environment instead and report no token stored while
      # its bot authenticated off the keyring beside it.
      - TELEGRAM_BOT_TOKEN_KEYRING_KEY=EXAMPLE_TELEGRAM_BOT_TOKEN
      - PYTHONNOUSERSITE=1
      - PYTHONPATH=/usr/src/app/vendor
      # Its own keyring, in its own folder: the install's shared one holds
      # other minds' secrets and is not mounted here.
      - KEY_RING=/usr/src/app/minds/example/data/keyring
      # This mind's own GitHub token, under a name no other mind uses.
      # Every mind here resolves the same keyring file, separated only by
      # key name, so a mind falling back to the default would store its
      # token over another's and both would read as working and wrong.
      - GITHUB_TOKEN_KEYRING_KEY=EXAMPLE_GITHUB_TOKEN
      # This mind's home is image layers nothing else reads and a rebuild
      # deletes, so writing `git` and `gh`'s own files there is its own
      # business. An edge mind shares a home with the person who owns the
      # machine and must never be given this.
      - GITHUB_TOKEN_CONFIGURES_TOOLS=1
      # The dsh launcher, inside the harness tree mounted below. dsh is a
      # built working copy rather than an npm install, so it is mounted, not
      # baked into the image; a host without the tree leaves dsh reported
      # unavailable by GET /harnesses rather than the mind refusing to start.
      - DSH_BIN=/opt/dsh/apps/cli/lib/bin.js
      # Codex's and dsh's homes, this mind's own. Never ~/.codex or ~/.dsh: an
      # undeclared home leaves that harness unavailable rather than borrowing
      # someone else's login and history.
      - CODEX_HOME=/usr/src/app/minds/example/.codex
      - DSH_HOME=/usr/src/app/minds/example/.dsh
    volumes:
      # A mind that does not hold the operator role (feature 834, requirement
      # 33) sees the code read-only, its own folder and its own key folder, and
      # nothing that is a secret: no settings file, no other mind's folder, no
      # shared keyring, no other key folder, no administrator credential. An
      # operator mind may be given whatever its operator chooses; this file is
      # the one for every other mind.
      #
      # The code is a clean clone of the repository, never the folder that
      # holds the settings file: HOST_CODE_DIR, which the installer sets to its
      # own clone (`repos/hive-mind`) and a hand-kept machine sets to a clone it
      # keeps beside the install. A mind that works on the hive's own code still
      # has all of it, without the secrets. The minds folder of that clone needs
      # an empty `minds/<this mind>` for the next line to land on.
      # `tools/stateless/mind_mounts/mind_mounts.py check` lists any mind on a
      # machine whose own copy of this file reaches a secret.
      - ${HOST_CODE_DIR:?set HOST_CODE_DIR to a clean clone of the repository}:/usr/src/app:ro
      - ${HOST_PROJECT_DIR:-.}/minds/example:/usr/src/app/minds/example:rw
      - ${HOST_PROJECT_DIR:-.}/minds/example/.claude:/home/hivemind/.claude-config:rw
      # This mind's own key folder and no other mind's.
      - ${HOST_KEY_DIR:?set HOST_KEY_DIR to a folder outside the checkout}/example:/run/mind-key:ro
      # The dsh harness tree, read-only: a launcher must not rewrite the tree
      # it boots from.
      - ${HOST_DSH_DIR:-/opt/dsh}:/opt/dsh:ro
    restart: unless-stopped
    networks:
      - hivemind
    tmpfs:
      # exec, which Docker's tmpfs default is not: dsh's native loader dlopens
      # a copy of its addon from /tmp (see CLAUDE.md, "What a dsh mind needs").
      - /tmp:exec,mode=1777
      # The modules hold the console's and terminal's .env and data/, the tools
      # .env and credentials: not a mind's to read (see the installer's masks).
      - /usr/src/app/modules:ro
      - /usr/src/app/.git/modules:ro
    # One mind server runs claude, codex and dsh, and routes each conversation
    # to the harness it names; runtime.yaml's `harness` is only the default.
    command: ["/opt/venv/bin/python3", "-m", "minds.mind_server"]
