# ─────────────────────────────────────────────────────────────
# Per-mind container fragments live in minds/<name>/container/compose.yaml.
# Each fragment is a complete Compose document with a single `services:` entry.
# Add one `- path:` line per mind below to wire it into the deployment.
# ─────────────────────────────────────────────────────────────
include:
  - path: minds/example/container/compose.yaml

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ─────────────────────────────────────────────────────────────
  # Nervous system — lucent (vector store + KG) and comms (gateway:
  # sessions, broker, HITL). Built from nervous-system/. Every surface
  # and mind reaches them as hive-lucent:8424 / hive-comms:8424 on the
  # hivemind network; host ports 8425 / 8426 serve bare-metal callers.
  # ─────────────────────────────────────────────────────────────
  lucent:
    logging: *default-logging
    build:
      context: ./nervous-system
    container_name: hive-lucent
    init: true
    restart: unless-stopped
    networks:
      - hivemind
    # Embeddings come from Ollama on the host, not from inside this
    # container — resolve the host gateway so OLLAMA_BASE_URL below has
    # something to point at.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8425:8424"
    environment:
      LUCENT_API_PORT: "8424"
      LUCENT_URL_SELF: "http://127.0.0.1:8424"
      LUCENT_DB_PATH: "/data/lucent.db"
      # Every /memory/retrieve and /memory/store embeds through Ollama.
      # The code default is loopback, which inside a container is the
      # container itself — set it explicitly or retrieval fails closed
      # with connection refused. Override in .env for a remote Ollama.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      # The nightly pruner classifies through hive-tools; same reasoning.
      HIVE_TOOLS_URL: "http://hive-tools:9421"
      PRUNE_LOG_PATH: "/data/prune.log"
      PRUNE_CRON: "0 4 * * *"
      PRUNE_TIMEZONE: "America/Chicago"
      # PRUNE_PROJECT_ROOT: /mnt/project — mount a source tree and set this
      # to let the pruner verify codebase_ref anchors; unset, refs are
      # unverifiable and the entries are kept.
    env_file:
      - ./nervous-system/.env
    volumes:
      - ./nervous-system/data:/data
      # Bind-mount the API source so schema additions and hot fixes don't
      # require an image rebuild — restart the container to pick up changes.
      - ./nervous-system/lucent_api:/app/lucent_api

  comms:
    logging: *default-logging
    build:
      context: ./nervous-system
      dockerfile: comms/Dockerfile
    container_name: hive-comms
    init: true
    restart: unless-stopped
    networks:
      - hivemind
    # Resolve host.docker.internal to the host gateway on Linux so comms
    # can dispatch HTTP to bare-metal minds.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8426:8424"
    environment:
      COMMS_PORT: "8424"
      COMMS_PROJECT_DIR: "/app"
      BROKER_DB_PATH: "/data/broker.db"
      SESSIONS_DB_PATH: "/data/sessions.db"
    env_file:
      - ./nervous-system/.env
    volumes:
      - ./nervous-system/data:/data
      # Bind-mount comms/ so code edits don't require a rebuild —
      # restart the container to pick up changes.
      - ./nervous-system/comms:/app/comms

  # ─────────────────────────────────────────────────────────────
  # Voice server — STT + TTS for any surface that wants voice.
  # Port 8422 is published so bare-metal clients can reach it.
  # ─────────────────────────────────────────────────────────────
  voice-server:
    build:
      context: .
      dockerfile: Dockerfile.voice
    container_name: hive-mind-voice
    init: true
    working_dir: /usr/src/app
    restart: always
    ports:
      - "8422:8422"
    networks:
      - hivemind
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/usr/src/app
      - whisper-cache:/home/hivemind/.cache
    environment:
      - WHISPER_MODEL=medium
      # Which reference clip a mind is spoken from lives on that mind's broker
      # row, so this server has to be able to read the listing. Without these
      # it resolves nobody, every mind falls back to `voice_ref.wav`, and the
      # console's clip picker reports a save that changes nothing audible.
      - COMMS_URL=http://hive-comms:8424
      - COMMS_BEARER_TOKEN=${COMMS_BEARER_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["/opt/venv/bin/python3", "-m", "voice.voice_server"]

  # Kokoro voice server -- fast, non-cloning TTS for minds that don't need a
  # cloned voice. Same module/STT as voice-server, selected via TTS_ENGINE.
  # Reachable in-network at http://voice-server-kokoro:8422, host port 8423.
  # Point a mind's VOICE_SERVER_URL here instead of voice-server to use it.
  voice-server-kokoro:
    build:
      context: .
      dockerfile: Dockerfile.voice.kokoro
    container_name: hive-mind-voice-kokoro
    init: true
    working_dir: /usr/src/app
    restart: always
    ports:
      - "8423:8422"
    networks:
      - hivemind
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/usr/src/app
      - kokoro-cache:/home/hivemind/.cache
    environment:
      - WHISPER_MODEL=medium
      - TTS_ENGINE=kokoro
      - KOKORO_DEFAULT_VOICE=${KOKORO_DEFAULT_VOICE:-af_heart}
      # Where a Mind's chosen voice is read from. Without these the resolver
      # answers nothing for every Mind and the console's picker writes a voice
      # this server never consults — a Save that reports success and changes
      # nothing audible.
      - COMMS_URL=http://hive-comms:8424
      - COMMS_BEARER_TOKEN=${COMMS_BEARER_TOKEN}
      # Legacy per-mind overrides, JSON: {"ada":"af_bella"}. The Mind's own
      # record wins over this; it remains only for a Mind that has chosen none.
      - KOKORO_VOICE_MAP=${KOKORO_VOICE_MAP:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["/opt/venv/bin/python3", "-m", "voice.voice_server"]

  # ─────────────────────────────────────────────────────────────
  # Example Telegram bot.
  # Duplicate this block per mind. Set MIND_ID to the mind's id and
  # TELEGRAM_BOT_TOKEN_KEYRING_KEY to the keyring entry holding that
  # mind's bot token.
  # ─────────────────────────────────────────────────────────────
  telegram-bot:
    build: .
    container_name: hive-mind-telegram
    init: true
    working_dir: /usr/src/app
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/usr/src/app
      - ${HOST_CLAUDE_DIR:-~/.claude}:/home/hivemind/.claude
    restart: unless-stopped
    depends_on:
      - comms
      - voice-server
    networks:
      - hivemind
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - HIVE_MIND_SERVER_URL=http://hive-comms:8424
      # The name the surfaces core actually reads. Its default is
      # 127.0.0.1:8426, which inside a container is nothing at all.
      - COMMS_URL=http://hive-comms:8424
      - COMMS_BEARER_TOKEN=${COMMS_BEARER_TOKEN}
      - VOICE_SERVER_URL=http://voice-server:8422
      # Both engines, so a mind whose record names one is spoken by it. The
      # line above stays as the fallback for a mind that names neither.
      - VOICE_SERVER_URL_CHATTERBOX=http://voice-server:8422
      - VOICE_SERVER_URL_KOKORO=http://voice-server-kokoro:8422
      - PYTHON_KEYRING_BACKEND=core.keyring_backend.HiveMindKeyring
      - PYTHONNOUSERSITE=1
      - KEY_RING=/usr/src/app/data/keyring
      - MIND_ID=example
      - TELEGRAM_BOT_TOKEN_KEYRING_KEY=EXAMPLE_TELEGRAM_BOT_TOKEN
      # Direct channel to this mind's backend for proactive (unsolicited)
      # delivery. Point at the backend service on the hivemind network, e.g.
      # http://<mind>:8420. Requires COMMS_BEARER_TOKEN in this env to auth.
      # - MIND_BACKEND_URL=http://example:8420
    command: ["/opt/venv/bin/python3", "-m", "surfaces.telegram"]

  # The one database every Hive service reads and writes.
  #
  # Its own instance rather than sharing a general-purpose Postgres: a
  # database going into a corporate setting needs its own credentials, its
  # own backup and its own tuning, and the memory store needs a current
  # pgvector.
  hive-postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg17
    container_name: hive-postgres
    restart: unless-stopped
    networks:
      - hivemind
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=hive
      - POSTGRES_USER=hive
      # Not `${VAR:?}`: that form fails interpolation for the whole
      # file, so an unset password would break `compose down` and
      # `restart hive-comms` in the middle of an incident. An empty
      # value makes this container refuse to initialise, which is the
      # blast radius it should have.
      - POSTGRES_PASSWORD=${HIVE_PG_PASSWORD}
      # Checksums cannot be turned on after initdb without a rewrite, and a
      # silently corrupt page in the memory store is worse than a loud one.
      - POSTGRES_INITDB_ARGS=--data-checksums
    # Loopback only, and published at all because some consumers are not on
    # this network and never will be: the inference proxy runs as a bare host
    # process, and bare-metal edge minds run in host venvs. Every container
    # reaches this by name instead. 5432 is left free for a stock install.
    # Widening this to 0.0.0.0 is a decision about exposing the whole hive's
    # data to the LAN, not a convenience.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hive-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone answers true while the server is still replaying
      # WAL and refusing connections, so a dependent service can start
      # against a database that is not accepting queries yet.
      # Over TCP to this container's own address, with the password.
      # initdb writes `local all all trust` AND `host all all
      # 127.0.0.1/32 trust`, so neither the socket nor loopback checks
      # the credential — only an address matching the catch-all `host
      # all all all scram-sha-256` rule does. POSTGRES_PASSWORD is
      # only read at initdb, so rotating it in .env leaves the stored
      # password behind — this is what notices.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$(hostname -i)\" -U hive -d hive -c 'select 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # Example Discord bot.
  # ─────────────────────────────────────────────────────────────
  discord-bot:
    build: .
    container_name: hive-mind-discord
    init: true
    working_dir: /usr/src/app
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/usr/src/app
      - ${HOST_CLAUDE_DIR:-~/.claude}:/home/hivemind/.claude
    restart: unless-stopped
    depends_on:
      - comms
      - voice-server
    networks:
      - hivemind
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - HIVE_MIND_SERVER_URL=http://hive-comms:8424
      # The name the surfaces core actually reads. Its default is
      # 127.0.0.1:8426, which inside a container is nothing at all.
      - COMMS_URL=http://hive-comms:8424
      - COMMS_BEARER_TOKEN=${COMMS_BEARER_TOKEN}
      - VOICE_SERVER_URL=http://voice-server:8422
      # Both engines, so a mind whose record names one is spoken by it. The
      # line above stays as the fallback for a mind that names neither.
      - VOICE_SERVER_URL_CHATTERBOX=http://voice-server:8422
      - VOICE_SERVER_URL_KOKORO=http://voice-server-kokoro:8422
      - PYTHON_KEYRING_BACKEND=core.keyring_backend.HiveMindKeyring
      - PYTHONNOUSERSITE=1
      - KEY_RING=/usr/src/app/data/keyring
      - MIND_ID=example
    command: ["/opt/venv/bin/python3", "-m", "surfaces.discord"]

# Per-mind service definitions are pulled in via the `include:` block at the top of
# this file. See minds/example/container/compose.yaml for a fragment template.
# The /generate-compose skill scaffolds new fragments; wire each one into `include:`
# explicitly when you add it.

networks:
  hivemind:
    external: true
    name: hivemind

volumes:
  # Named rather than a bind mount: Postgres wants the host's fastest
  # disk, which is wherever the Docker root lives.
  hive-postgres-data:
  whisper-cache:
  kokoro-cache:
