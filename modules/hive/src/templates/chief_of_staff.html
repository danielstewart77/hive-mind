{% extends "layout.html" %}
{% block mobile_header_actions %}
<button type="button" class="cos-topbar-done" data-barrel-toggle
        aria-expanded="false" aria-controls="cos-barrel-pane">
  Done <b data-done-count>0</b>
</button>
{% endblock %}
{% block content %}
<style>
  .cos-head { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
  .cos-head h1 { margin:0; }
  .cos-sub { color:#94a3b8; font-size:0.9rem; }

  /* The panes. On a large screen the graph and the barrel share one row.
     On a phone-size screen the barrel slides in over the page instead and
     never pushes it (feature 3.6, 2026-11-15, which replaced the push).
     The questions are NOT in the barrel — see below. */
  .cos-stage { position:relative; overflow:hidden; margin-top:1rem; }
  .cos-wrap { display:flex; gap:1rem; align-items:stretch; }
  /* min-width:0 is what keeps the barrel on screen. A flex item's minimum
     is its content, and Cytoscape sizes its canvas to the widest the window
     has been — so widening the window and narrowing it again left the graph
     at the old width and pushed the barrel off the right-hand edge. */
  #cos-cy {
    flex:1 1 auto; min-width:0; min-height:62vh; height:62vh;
    background:#0a0e19; border-radius:10px; border:1px solid rgba(56,189,248,0.18);
    position:relative;
  }
  /* Every decoration a card carries — the work-type icon, the assigned
     mind's face and the activity spinner — lives in this layer rather than
     on the Cytoscape node. One mechanism instead of two: a spinner has to
     animate, which a canvas-drawn node style cannot, and a face that fails
     to load has to fall back to a letter, which a background image cannot.
     Never a hit target: it sits over the canvas, and swallowing taps would
     cost the panning and pinch-zoom the page is read on a phone with. */
  .cos-deco { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
  .cos-deco > * { position:absolute; will-change:transform; }
  .cos-kind, .cos-face {
    display:flex; align-items:center; justify-content:center;
    border-radius:5px; overflow:hidden; box-sizing:border-box;
  }
  .cos-kind { color:#cbd5e1; background:rgba(2,6,23,0.72); }
  .cos-kind svg { width:100%; height:100%; display:block; }
  .cos-face { background:#0b1220; border:1px solid rgba(148,163,184,0.45); border-radius:50%; }
  .cos-face img { width:100%; height:100%; object-fit:cover; display:block; }
  .cos-face span { color:#e2e8f0; font-weight:600; line-height:1; }
  .cos-kind svg, .cos-face img { pointer-events:none; }
  .cos-spin {
    border-radius:50%; border-style:solid; border-color:rgba(34,197,94,0.25);
    border-top-color:#22c55e; animation:cos-rotate .9s linear infinite;
  }
  @keyframes cos-rotate { to { transform:rotate(360deg); } }
  /* A sub-agent known only to be unfinished: still, and never green. The
     spinner beside it is reserved for a child a harness has reported as
     producing work, and the difference between the two is the point. */
  .cos-run {
    border-radius:50%; border:2px solid #2dd4bf; background:rgba(45,212,191,0.18);
  }
  @media (prefers-reduced-motion: reduce) {
    .cos-spin { animation-duration:3s; }
  }

  /* The barrel. Its header, with the close control, stays put and only the
     list under it scrolls, so a long list never scrolls the way out away. */
  .cos-barrel {
    flex:0 0 280px; max-width:280px; box-sizing:border-box;
    display:flex; flex-direction:column; overflow:hidden;
    background:#0a0e19; border:1px solid rgba(56,189,248,0.18);
    border-radius:10px; padding:1rem; height:62vh;
    font-size:0.82rem; color:#cbd5e1;
  }
  .cos-barrel-head { display:flex; align-items:center; justify-content:space-between;
    gap:.5rem; margin:0 0 0.75rem 0; flex:0 0 auto; }
  .cos-barrel h2 { font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;
    color:#64748b; margin:0; }
  .cos-barrel-close {
    display:inline-flex; align-items:center; justify-content:center;
    width:2rem; height:2rem; padding:0; border-radius:8px; cursor:pointer;
    border:1px solid rgba(56,189,248,0.3); background:#0d1424; color:#cbd5e1;
    font-size:1.2rem; line-height:1;
  }
  .cos-barrel-list { flex:1 1 auto; min-height:0; overflow-y:auto;
    overscroll-behavior:contain; }
  .cos-done {
    display:flex; gap:0.5rem; align-items:flex-start;
    padding:0.45rem 0.55rem; margin-bottom:0.4rem; border-radius:6px;
    background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.22);
  }
  .cos-done .k { color:#4ade80; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; }
  .cos-empty { color:#64748b; font-style:italic; }

  .cos-handle {
    position:absolute; top:0; right:0; z-index:10;
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.35rem .6rem; border:1px solid rgba(56,189,248,0.3);
    border-radius:0 10px 0 10px; background:#0d1424; color:#cbd5e1;
    font-size:.75rem; cursor:pointer;
  }
  .cos-handle b, .cos-topbar-done b { color:#4ade80; }
  /* The phone's done button, in the console's top bar. */
  .cos-topbar-done {
    display:inline-flex; align-items:center; gap:.35rem; min-height:34px;
    padding:.3rem .65rem; border:1px solid rgba(56,189,248,0.3);
    border-radius:8px; background:#0d1424; color:#cbd5e1;
    font-size:.8rem; cursor:pointer;
  }
  /* The site-wide button hover paints a solid accent, which a tap leaves
     behind on a phone and which drowns the count. These keep their own. */
  .cos-topbar-done:hover, .cos-handle:hover, .cos-barrel-close:hover {
    background:#132036; color:#e2e8f0; border-color:rgba(56,189,248,0.55);
    transform:none; box-shadow:none;
  }

  /* The questions are their own pane and are never inside the barrel. The
     count of answers the hive is waiting on is the one thing this page is
     read for, so collapsing "Done" on a phone must not take it with it. */
  .cos-asks-pane {
    margin-top:0.85rem; padding:0.7rem 0.85rem; border-radius:10px;
    background:#0a0e19; border:1px solid rgba(251,191,36,0.28);
  }
  .cos-asks-pane h2 { font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
    color:#fbbf24; margin:0 0 0.6rem 0; }
  .cos-ask {
    padding:0.55rem 0.65rem; margin-bottom:0.5rem; border-radius:8px;
    background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.35);
    font-size:0.85rem; color:#e2e8f0;
  }
  .cos-ask .who { color:#fbbf24; font-size:0.72rem; text-transform:uppercase;
    letter-spacing:0.06em; display:block; margin-bottom:0.2rem; }

  .cos-foot {
    display:flex; gap:1.5rem; flex-wrap:wrap; align-items:center;
    margin-top:0.85rem; padding:0.7rem 1rem; border-radius:10px;
    background:#0a0e19; border:1px solid rgba(56,189,248,0.18);
    color:#cbd5e1; font-size:0.85rem;
  }
  .cos-foot b { color:#e2e8f0; }
  .cos-bar { flex:1 1 180px; height:8px; border-radius:99px; background:rgba(148,163,184,0.18); overflow:hidden; }
  .cos-bar span { display:block; height:100%; background:#38bdf8; }
  .cos-error { color:#f87171; }
  .cos-stale { color:#fbbf24; }

  /* 820px is the site's one mobile breakpoint, and the console's top bar
     exists only at or below it. Large screen: the barrel sits in the row and
     the graph gives it the room. Docked means gone — the barrel used to keep
     its 280 pixels whatever the class said, so on a workstation the handle
     toggled a class, flipped aria-expanded and changed nothing on screen. */
  .cos-stage:not(.barrel-open) .cos-barrel { display:none; }
  @media (min-width: 821px) {
    .cos-topbar-done { display:none; }
  }
  /* Phone-size: the done button is the one in the top bar, and the barrel
     slides in over the page below that bar, so the bar stays reachable. It
     never pushes: the page underneath does not move. Docked, it is slid
     away and hidden, so Tab and a screen reader do not land in it. */
  @media (max-width: 820px) {
    .cos-handle { display:none; }
    #cos-cy { min-height:68vh; height:68vh; }
    .cos-barrel {
      position:fixed; top:var(--console-topbar-height, 55px); right:0; bottom:0;
      z-index:105; width:min(360px, 100vw); max-width:none; height:auto;
      border-radius:0; border-width:0 0 0 1px;
      box-shadow:-18px 0 48px rgba(0,0,0,.45);
      transform:translateX(100%); visibility:hidden;
      transition:transform .2s ease, visibility 0s linear .2s;
      /* A scroll over any part of it — the header too, not just the list —
         stays in it and never moves the page underneath. */
      overflow-y:auto; overscroll-behavior:contain;
    }
    .cos-stage:not(.barrel-open) .cos-barrel { display:flex; }
    .cos-barrel-head { touch-action:none; }
    .cos-stage.barrel-open .cos-barrel {
      transform:none; visibility:visible; transition:transform .2s ease;
    }
  }
  /* A narrow phone: open, the barrel is the whole screen under the bar. */
  @media (max-width: 620px) {
    .cos-barrel { left:0; width:auto; border-width:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cos-barrel { transition:none !important; }
  }
</style>

<div class="cos-head">
  <h1>Chief of Staff</h1>
  <span class="cos-sub" id="cos-when">loading…</span>
  <span class="cos-sub" id="cos-detail"></span>
</div>

<div class="cos-stage" id="cos-stage" data-push-panel="barrel-open">
  <div class="cos-wrap">
    <div id="cos-cy">
      <button type="button" class="cos-handle" id="cos-barrel-toggle"
              data-barrel-toggle
              aria-expanded="false" aria-controls="cos-barrel-pane">
        Done <b id="cos-done-n" data-done-count>0</b>
      </button>
      <div class="cos-deco" id="cos-deco"></div>
    </div>
    <aside class="cos-barrel" id="cos-barrel-pane" aria-label="Done stories">
      <div class="cos-barrel-head">
        <h2>Done</h2>
        <button type="button" class="cos-barrel-close" data-barrel-close
                aria-label="Close done stories" title="Close">&times;</button>
      </div>
      <div id="cos-barrel" class="cos-barrel-list"><p class="cos-empty">Nothing yet.</p></div>
    </aside>
  </div>
</div>

<script>
  // Where the done bucket starts, decided here — before the page first
  // paints and before the graph library loads — so a remembered state is
  // simply there, rather than sliding in or out on every visit.
  //
  // Open or docked is remembered per browser, once for phone-size screens
  // and once for large ones (feature 3.6, 2026-11-15): docking it on a
  // phone never makes the desktop start docked, nor the reverse. With
  // nothing remembered a phone starts docked and a large screen open.
  // Storage that is blocked or throws is treated as remembering nothing:
  // the page and its buttons work exactly as they would without it.
  window.cosBarrelMemory = (function () {
    var PHONE = '(max-width: 820px)';  // the site's one mobile breakpoint
    var KEYS = { phone: 'hive.cos.doneBucket.phone',
                 large: 'hive.cos.doneBucket.large' };
    function sizeClass() {
      return window.matchMedia(PHONE).matches ? 'phone' : 'large';
    }
    function recall() {
      try {
        var v = window.localStorage.getItem(KEYS[sizeClass()]);
        return v === 'open' ? true : v === 'docked' ? false : null;
      } catch (e) { return null; }
    }
    return {
      start: function () {
        var r = recall();
        return r === null ? sizeClass() === 'large' : r;
      },
      remember: function (open) {
        try {
          window.localStorage.setItem(KEYS[sizeClass()],
                                      open ? 'open' : 'docked');
        } catch (e) { /* not remembered; the bucket still moved */ }
      }
    };
  })();
  document.getElementById('cos-stage').classList
    .toggle('barrel-open', window.cosBarrelMemory.start());
</script>

<div class="cos-asks-pane">
  <h2>Waiting on you (<span id="cos-asks-n">0</span>)</h2>
  <div id="cos-asks"><p class="cos-empty">Nothing.</p></div>
</div>

<div class="cos-foot">
  <span><b id="cos-tasks">0</b> live</span>
  <span><b id="cos-agents">0</b> delegates</span>
  <span><b id="cos-done">0</b> done</span>
  <div class="cos-bar"><span id="cos-progress" style="width:0%"></span></div>
  <span id="cos-pct">0%</span>
</div>

<!-- async: the page, its buttons and the done bucket never wait on the
     graph library. Blocking, a slow cdnjs left a remembered-open bucket on
     screen with a close control nothing had wired up yet. -->
<script id="cos-cytoscape" async src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
<script>
(function () {
  // Drawn from one payload, so the tree, the barrel and the counts can never
  // disagree about the same moment. The page re-asks rather than being
  // pushed to: what it shows changes on the order of a minute, which is the
  // tick's own cadence, and a socket per open tab buys nothing for that.
  var REFRESH_MS = 20000;
  // A request that never answers must not leave the page claiming work is
  // running. Past this the load is abandoned and the page says it is stale.
  var FETCH_TIMEOUT_MS = 12000;
  // Past this age the payload is no longer evidence of anything live, so the
  // spinners come off. An absence of fresh data is not an absence of work,
  // but it is certainly not proof of work.
  var STALE_AFTER_MS = REFRESH_MS * 3;
  // The site's one mobile breakpoint, matching console.css.
  var MOBILE = '(max-width: 820px)';
  // Below this the chart is unreadable on a phone, which is the whole of
  // Daniel's complaint: fit-to-everything shrinks nine nodes to nothing.
  // The view opens no smaller than this and he zooms out if he wants to.
  var MIN_READABLE_ZOOM = 0.55;
  // Where the chief sits when the view has been zoomed in to stay readable.
  var TOP_MARGIN = 54;

  var KIND_COLOR = {
    chief: '#38bdf8', task: '#818cf8', feature: '#a78bfa',
    story: '#64748b', agent: '#2dd4bf', bubble: '#fbbf24'
  };
  // A node says what is happening to it by its border, not its fill: the
  // fill already says what kind of thing it is, and one node cannot carry
  // two colours without the reader guessing which is which.
  var ACTIVITY_BORDER = {
    working: '#22c55e', stopped: '#f59e0b', ended: '#64748b',
    unassigned: '#f87171', orphaned: '#f87171'
  };

  // The work-type glyph each card wears in its upper-left. Inline rather
  // than fetched so a card is never briefly typeless, and sized here
  // because an SVG with no width and height draws nothing in Firefox.
  // A crown for an epic, a trophy for a feature, an open book for a story
  // (Daniel, 2026-11-15). The chief has none: his node is his own face.
  // A sub-agent's robot is not a corner glyph but the whole node.
  var KIND_ICON = {
    epic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 5 7l4 4 3-6 3 6 4-4 2 11Z"/><path d="M4 21h16"/></svg>',
    feature: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>',
    story: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2Z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7Z"/></svg>',
    bug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3a4 4 0 0 0 8 0V2"/><rect x="6" y="7" width="12" height="12" rx="6"/><path d="M3 11h3"/><path d="M18 11h3"/><path d="M4 17h3"/><path d="M17 17h3"/></svg>',
    task: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
    agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg>'
  };

  // Quotes included. The site-wide helper escapes them and this page's own
  // did not; anything written into an attribute needs them, and a session
  // name is unconstrained text from the registry.
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function elements(data) {
    var out = [];
    data.nodes.forEach(function (n) {
      var label = n.kind === 'chief'
        ? n.label + (n.questions ? '  (' + n.questions + '?)' : '')
        : n.label;
      // The session name sits beside the work's own name rather than
      // replacing it: the task name is what the work is, the session name is
      // which conversation is on it, and Daniel asked to see the second
      // without losing the first. It is on this node only — a child of an
      // assigned item carries no name, which is the payload's doing.
      var names = n.session_names || [];
      if (names.length) label = label + '\n· ' + names[0];
      var face = (n.minds || [])[0] || null;
      out.push({ data: {
        id: n.id, label: label, kind: n.kind,
        activity: n.activity || n.status || '',
        workKind: n.work_kind || '',
        active: n.active === true,
        faceId: face ? face.mind_id : '',
        faceInitial: face ? face.initial : '',
        faceVersion: face ? face.image_version : 0,
        detail: n.about || n.description || ''
      } });
    });
    var lifts = liftedAgents(data);
    data.edges.forEach(function (e) {
      var depth = lifts[e.source + '>' + e.target] || 0;
      // Drawn straight from the parent to its child, but kept out of the
      // layout when the child is lifted: the spacer chain beside it is what
      // gives the child its row.
      out.push({ data: { id: 'e:' + e.source + ':' + e.target,
                         source: e.source, target: e.target,
                         rel: depth ? 'lifted' : 'tree' } });
      if (!depth) return;
      var prev = e.source;
      for (var i = 1; i <= depth; i++) {
        var sp = 'sp:' + e.source + ':' + i;
        if (!out.some(function (o) { return o.data.id === sp; })) {
          out.push({ data: { id: sp, label: '', kind: 'spacer', activity: '',
                             workKind: '', active: false, faceId: '',
                             faceInitial: '', faceVersion: 0, detail: '' } });
          out.push({ data: { id: 'e:' + prev + ':' + sp, source: prev,
                             target: sp, rel: 'spacer' } });
        }
        prev = sp;
      }
      out.push({ data: { id: 'e:' + prev + ':' + e.target + ':lift',
                         source: prev, target: e.target, rel: 'spacer',
                         last: true } });
    });
    // One bubble per question, beside the node that holds it and tied back
    // to the chief, because the thing Daniel reads off this page is that an
    // answer is owed and which work stops without it. It takes no rank in
    // the tree: it is placed to the right of its node once the tree is laid
    // out (Daniel, 2026-11-15), so it is joined to the chief only.
    data.questions.forEach(function (q) {
      var id = 'q:' + q.task;
      out.push({ data: { id: id, label: '?', kind: 'bubble',
                         activity: 'question', workKind: '', active: false,
                         faceId: '', faceInitial: '', faceVersion: 0,
                         owner: q.task, detail: q.question } });
      out.push({ data: { id: 'e:up:' + id, source: id, target: 'chief',
                         rel: 'bubble' } });
    });
    return out;
  }

  // Which sub-agents are lifted off their parent's row, and by how many
  // rows. A task covering a whole feature or epic has sub-agents of its own
  // that belong to no one story, and hung straight beneath it they would sit
  // on the same row as its stories - the side-by-side drawing Daniel asked
  // to be rid of (2026-11-15). Each is lifted to the row below the deepest
  // work beneath that parent, so reading down a chain passes feature, then
  // story, then agent. Keyed 'parent>child'.
  function liftedAgents(data) {
    var kindOf = {};
    data.nodes.forEach(function (n) { kindOf[n.id] = n.kind; });
    var kids = {};
    data.edges.forEach(function (e) {
      (kids[e.source] = kids[e.source] || []).push(e.target);
    });
    function height(id, seen) {
      if (seen[id]) return 0;
      seen[id] = true;
      var best = 0;
      (kids[id] || []).forEach(function (c) {
        if (kindOf[c] === 'agent') return;
        best = Math.max(best, 1 + height(c, seen));
      });
      return best;
    }
    var out = {};
    data.edges.forEach(function (e) {
      if (kindOf[e.target] !== 'agent' || kindOf[e.source] === 'agent') return;
      var h = height(e.source, {});
      if (h > 0) out[e.source + '>' + e.target] = h;
    });
    return out;
  }

  var STYLE = [
    { selector: 'node', style: {
        'label': 'data(label)', 'color': '#e2e8f0', 'font-size': '11px',
        'text-valign': 'center', 'text-halign': 'center',
        'text-wrap': 'wrap', 'text-max-width': '100px',
        'shape': 'round-rectangle', 'width': 174, 'height': 62,
        'padding': '6px', 'background-color': '#1e293b',
        'border-width': 2, 'border-color': '#334155'
    } },
    // A plain circle that Stash's own face fills, with nothing else on it:
    // no card, no crown (Daniel, 2026-11-15). His name and the count of
    // answers owed sit beneath it, because the count is what the page is
    // read for and a circle filled by a face has no room for it.
    { selector: 'node[kind = "chief"]', style: {
        'shape': 'ellipse', 'width': 96, 'height': 96,
        'background-color': '#0b1220', 'border-color': KIND_COLOR.chief,
        'border-width': 3, 'color': '#e2e8f0',
        'font-size': '14px', 'font-weight': 'bold',
        'text-valign': 'bottom', 'text-margin-y': 8,
        'text-max-width': '200px' } },
    { selector: 'node[kind = "task"]', style: {
        'background-color': '#1e1b4b', 'border-color': KIND_COLOR.task } },
    { selector: 'node[kind = "feature"]', style: {
        'background-color': '#2e1065', 'border-color': KIND_COLOR.feature } },
    { selector: 'node[kind = "story"]', style: {
        'background-color': '#111827', 'border-color': KIND_COLOR.story,
        'width': 156, 'height': 50, 'font-size': '10px',
        'text-max-width': '104px' } },
    // A sub-agent is its robot and nothing else: no circle, no card, no
    // face (Daniel, 2026-11-15). The node is only the robot's footprint,
    // drawn by the decoration layer, and its few words sit beneath it the
    // way a session name sits beneath a card's own name.
    { selector: 'node[kind = "agent"]', style: {
        'shape': 'round-rectangle', 'width': 40, 'height': 40,
        'background-opacity': 0, 'border-width': 0,
        'color': '#99f6e4', 'font-size': '10px',
        'text-valign': 'bottom', 'text-margin-y': 4,
        'text-max-width': '130px', 'text-overflow-wrap': 'anywhere' } },
    // What lifts a whole feature's own sub-agents onto the row below its
    // stories. Takes up a rank in the layout and nothing on the screen.
    { selector: 'node[kind = "spacer"]', style: {
        'width': 1, 'height': 1, 'opacity': 0, 'events': 'no', 'label': '' } },
    { selector: 'node[kind = "bubble"]', style: {
        'background-color': KIND_COLOR.bubble, 'color': '#3b2708',
        'shape': 'ellipse', 'width': 34, 'height': 34,
        'font-size': '18px', 'font-weight': 'bold',
        'border-color': '#fde68a' } },
    { selector: 'node[activity = "working"]', style: {
        'border-color': ACTIVITY_BORDER.working } },
    { selector: 'node[activity = "stopped"]', style: {
        'border-color': ACTIVITY_BORDER.stopped } },
    { selector: 'node[activity = "unassigned"]', style: {
        'border-color': ACTIVITY_BORDER.unassigned } },
    // A sub-agent's working state is said by its spinner alone, never by
    // its border. A stale payload takes the spinners off; a green border
    // would stay behind and go on claiming activity nobody reported.
    { selector: 'node[kind = "agent"][activity = "working"]', style: {
        'border-color': KIND_COLOR.agent } },
    { selector: 'node[activity = "orphaned"]', style: {
        'border-color': ACTIVITY_BORDER.orphaned,
        'border-style': 'dashed' } },
    { selector: 'node[kind = "agent"][activity = "orphaned"]', style: {
        'border-width': 2 } },
    { selector: 'edge', style: {
        'width': 1.6, 'line-color': 'rgba(129,140,248,0.45)',
        'target-arrow-color': 'rgba(129,140,248,0.55)',
        'target-arrow-shape': 'triangle', 'curve-style': 'taxi',
        'taxi-direction': 'downward' } },
    // The line to a lifted child runs through its spacers, which have a
    // column of their own, so it never crosses the cards on the row it
    // passes. The direct edge is kept for the data and not drawn.
    { selector: 'edge[rel = "spacer"]', style: {
        'target-arrow-shape': 'none', 'events': 'no' } },
    { selector: 'edge[rel = "spacer"][?last]', style: {
        'target-arrow-shape': 'triangle' } },
    { selector: 'edge[rel = "lifted"]', style: {
        'opacity': 0, 'events': 'no' } },
    // The bubble's own rise to the chief: dashed, arrowless and behind
    // everything, so it reads as a thing floating up rather than as
    // another line of command.
    { selector: 'edge[rel = "bubble"]', style: {
        'line-color': 'rgba(251,191,36,0.35)', 'line-style': 'dashed',
        'target-arrow-shape': 'none', 'curve-style': 'unbundled-bezier',
        'control-point-distances': [-80], 'control-point-weights': [0.5],
        'z-index': 0 } }
  ];

  // Gaps between siblings and between rows, in model pixels.
  var COLUMN_GAP = 28;
  var ROW_GAP = 70;

  // A tidy tree rather than Cytoscape's breadthfirst. Breadthfirst spreads
  // each row on its own, so a story's sub-agents land wherever their row
  // has room - under some other story, or under another chain altogether -
  // and the chain Daniel asked for (2026-11-15) is there in the lines but
  // not in the drawing. Here every node sits centred over the children it
  // has, each subtree in its own band, so reading straight down a chain
  // passes feature, then story, then agent. Rows are as deep as their
  // deepest node. Bubbles take no part; the drawn edge of a lifted child
  // takes no part either, its spacers do.
  function runLayout() {
    var kids = {};
    var hasParent = {};
    cy.edges().forEach(function (e) {
      var rel = e.data('rel');
      if (rel === 'bubble' || rel === 'lifted') return;
      var src = e.data('source'), dst = e.data('target');
      if (hasParent[dst]) return;
      hasParent[dst] = true;
      (kids[src] = kids[src] || []).push(dst);
    });
    var nodes = cy.nodes().filter(function (n) {
      return n.data('kind') !== 'bubble';
    });
    // A node holding a question gets the room its bubble needs beside it,
    // so the bubble never lands on the next card along.
    var asks = {};
    cy.nodes('[kind = "bubble"]').forEach(function (b) {
      asks[b.data('owner')] = 2 * (b.outerWidth() + 6);
    });
    var widthOf = {};
    var depthOf = {};
    var seen = {};
    function measure(id, depth) {
      if (seen[id]) return 0;
      seen[id] = true;
      depthOf[id] = depth;
      var own = cy.getElementById(id).outerWidth() + COLUMN_GAP +
                (asks[id] || 0);
      var sum = 0;
      (kids[id] || []).forEach(function (c) { sum += measure(c, depth + 1); });
      widthOf[id] = Math.max(own, sum);
      return widthOf[id];
    }
    var roots = ['chief'];
    nodes.forEach(function (n) {
      if (n.id() !== 'chief' && !hasParent[n.id()]) roots.push(n.id());
    });
    roots.forEach(function (r) { if (cy.getElementById(r).length) measure(r, 0); });
    var rowHeight = {};
    nodes.forEach(function (n) {
      var d = depthOf[n.id()] || 0;
      rowHeight[d] = Math.max(rowHeight[d] || 0, n.outerHeight());
    });
    var rowTop = {};
    var y = 0;
    for (var d = 0; rowHeight[d] !== undefined; d++) {
      rowTop[d] = y;
      y += rowHeight[d] + ROW_GAP;
    }
    var at = {};
    var placed = {};
    function put(id, left) {
      if (placed[id]) return;
      placed[id] = true;
      var d = depthOf[id] || 0;
      at[id] = { x: left + widthOf[id] / 2, y: rowTop[d] + rowHeight[d] / 2 };
      var children = kids[id] || [];
      var sum = 0;
      children.forEach(function (c) { sum += widthOf[c] || 0; });
      var x = left + (widthOf[id] - sum) / 2;
      children.forEach(function (c) { put(c, x); x += widthOf[c] || 0; });
    }
    var left = 0;
    roots.forEach(function (r) {
      if (widthOf[r] === undefined) return;
      put(r, left);
      left += widthOf[r];
    });
    cy.batch(function () {
      nodes.forEach(function (n) { if (at[n.id()]) n.position(at[n.id()]); });
    });
    placeBubbles();
  }

  // Each bubble to the right of the node it belongs to, level with it, and
  // again whenever that node moves - a dragged card takes its question with
  // it rather than leaving it hanging where the layout put it.
  var placingBubbles = false;
  function placeBubbles() {
    if (cy === null || placingBubbles) return;
    placingBubbles = true;
    try {
      cy.nodes('[kind = "bubble"]').forEach(function (b) {
        var owner = cy.getElementById(b.data('owner'));
        if (!owner.length) return;
        var at = owner.position();
        // Clear of the card: its drawn width includes padding and border,
        // which `width()` leaves out.
        b.position({ x: at.x + owner.outerWidth() / 2 + 6 +
                        b.outerWidth() / 2, y: at.y });
      });
    } finally {
      placingBubbles = false;
    }
  }

  var cy = null;
  // The latest payload, held until the graph library has arrived.
  var pendingDraw = null;
  document.getElementById('cos-cytoscape').addEventListener('load', function () {
    if (pendingDraw !== null) {
      var data = pendingDraw;
      pendingDraw = null;
      draw(data);
    }
  });
  var lastGoodAt = 0;
  var deco = document.getElementById('cos-deco');
  var shape = '';
  var spinnersOn = true;

  function signature(els) {
    return els.map(function (e) { return e.data.id; }).sort().join('|');
  }

  // One instance for the life of the page. The old page built a new
  // Cytoscape every 20 seconds, which threw away the pan and zoom with it —
  // so "it can be panned and zoomed" was true for at most 20 seconds at a
  // time, which on a phone is the same as false. Elements are diffed in and
  // the layout is re-run only when the set of nodes actually changed.
  function draw(data) {
    var els = elements(data);
    var next = signature(els);
    if (cy === null) {
      cy = cytoscape({
        container: document.getElementById('cos-cy'),
        elements: els, style: STYLE, layout: { name: 'preset' },
        minZoom: 0.15, maxZoom: 3,
        userZoomingEnabled: true, userPanningEnabled: true
      });
      shape = next;
      runLayout();
      openReadably();
      cy.on('position', 'node[kind != "bubble"]', placeBubbles);
      cy.on('render', paintDeco);
      cy.on('position', paintDeco);
      cy.on('tap', 'node', function (evt) {
        var d = evt.target.data();
        document.getElementById('cos-detail').textContent =
          d.detail ? d.label.split('\n')[0] + ' — ' + d.detail : d.label;
      });
      return;
    }
    if (next === shape) {
      // Same tree, new readings. Update in place so nothing moves under
      // Daniel's finger and his view is left exactly where he put it.
      els.forEach(function (e) {
        var found = cy.getElementById(e.data.id);
        if (found.length) found.data(e.data);
      });
      paintDeco();
      return;
    }
    var pan = cy.pan();
    var zoom = cy.zoom();
    cy.batch(function () {
      cy.elements().remove();
      cy.add(els);
    });
    shape = next;
    runLayout();
    // The shape changed, so the old view may point at nothing — but it is
    // still the view he chose, so it is restored rather than refitted.
    cy.zoom(zoom);
    cy.pan(pan);
    paintDeco();
  }

  // Fit, but never below readable. Daniel's complaint was that the graph
  // opens tiny on a phone; `fit` alone guarantees exactly that as the tree
  // grows, because it shrinks whatever it is given to the width available.
  function openReadably() {
    cy.resize();
    cy.fit(undefined, 28);
    if (cy.zoom() < MIN_READABLE_ZOOM) {
      cy.zoom({ level: MIN_READABLE_ZOOM,
                renderedPosition: { x: cy.width() / 2, y: 0 } });
      var root = cy.getElementById('chief');
      if (root.length) {
        cy.center(root);
        // `center` puts the chief half way down, which on a phone spends the
        // top half of the screen on nothing and pushes his tasks off the
        // bottom — the tree hangs downward, so the root belongs near the top
        // and the work below it is what the space is for.
        cy.panBy({ x: 0, y: TOP_MARGIN - cy.height() / 2 });
      }
    }
  }

  function faceUrl(d) {
    return '/api/minds/' + encodeURIComponent(d.faceId) + '/image?v=' +
           encodeURIComponent(d.faceVersion);
  }

  // The decorations are built as elements, not as markup, and only when the
  // set of them actually changes. Two reasons, both learned the hard way.
  //
  // A face needs an error handler, and writing one as an `onerror="..."`
  // attribute meant concatenating a value into a quoted attribute — which
  // broke the attribute on every card (the initial is JSON-quoted, and the
  // attribute was quoted too), so the fallback never ran and a mind named
  // with a quote would have escaped into it. `textContent` on a real element
  // cannot be parsed as markup at all, which is the fix rather than another
  // layer of escaping.
  //
  // And `render` fires every frame of a pan or a pinch. Rebuilding the
  // markup each time recreated every `img`, which re-requests the picture
  // and flickers; positioning existing elements does not.
  var decoFor = {};
  var decoKey = '';
  var lastBarrelHtml = null;

  function decoSignature() {
    return cy.nodes().map(function (n) {
      var d = n.data();
      return [d.id, d.kind, d.workKind, d.faceId, d.faceVersion,
              d.active ? 1 : 0, d.activity].join(':');
    }).join('|');
  }

  function buildDeco() {
    // Cleared wholesale: a node that has left the tree must not leave its
    // face or its spinner hanging over the canvas.
    deco.textContent = '';
    decoFor = {};
    cy.nodes().forEach(function (node) {
      var d = node.data();
      if (d.kind === 'bubble' || d.kind === 'spacer') return;
      var entry = { node: node };

      var icon = KIND_ICON[d.workKind];
      if (icon) {
        entry.kind = document.createElement('span');
        entry.kind.className = 'cos-kind';
        // Our own constant, chosen by key from a table in this file — never
        // anything that came off a row.
        entry.kind.innerHTML = icon;
        deco.appendChild(entry.kind);
      }

      if (!d.faceId && d.kind === 'chief') {
        // A chief who is not a registered mind has no face to fetch; his
        // circle still says who he is rather than standing empty.
        entry.face = document.createElement('span');
        entry.face.className = 'cos-face';
        var only = document.createElement('span');
        only.textContent = (d.label || '?').trim().charAt(0).toUpperCase();
        entry.face.appendChild(only);
        deco.appendChild(entry.face);
      }
      if (d.faceId) {
        entry.face = document.createElement('span');
        entry.face.className = 'cos-face';
        var img = document.createElement('img');
        img.alt = '';
        img.src = faceUrl(d);
        var initial = d.faceInitial || '?';
        var holder = entry.face;
        img.addEventListener('error', function () {
          var letter = document.createElement('span');
          letter.textContent = initial;
          holder.replaceChildren(letter);
        });
        entry.face.appendChild(img);
        deco.appendChild(entry.face);
      }

      if (d.active === true) {
        entry.spin = document.createElement('span');
        entry.spin.className = 'cos-spin';
        deco.appendChild(entry.spin);
      } else if (d.kind === 'agent' && d.activity === 'running') {
        // Sits where the spinner would, so the two states read side by side.
        entry.spin = document.createElement('span');
        entry.spin.className = 'cos-run';
        entry.still = true;
        deco.appendChild(entry.spin);
      }

      decoFor[d.id] = entry;
    });
  }

  function place(el, left, top, size) {
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
  }

  function placeDeco() {
    var zoom = cy.zoom();
    var size = Math.max(9, Math.min(20, 15 * zoom));
    var inset = 5 * zoom;
    Object.keys(decoFor).forEach(function (id) {
      var entry = decoFor[id];
      var box = entry.node.renderedBoundingBox({ includeLabels: false });
      var w = box.x2 - box.x1;
      var hidden = w <= 0;
      var kind = entry.node.data('kind');
      if (entry.kind) {
        entry.kind.style.display = hidden ? 'none' : '';
        if (!hidden && kind === 'agent') {
          // The robot is the node.
          place(entry.kind, box.x1, box.y1, w);
          entry.kind.style.padding = (w * 0.1) + 'px';
        } else if (!hidden) {
          place(entry.kind, box.x1 + inset, box.y1 + inset, size);
          entry.kind.style.padding = (size * 0.12) + 'px';
        }
      }
      if (entry.face) {
        // Half again as large as the corner face used to be (Daniel,
        // 2026-11-15); the chief's fills his whole circle.
        var fs = kind === 'chief' ? w : size * 1.35 * 1.5;
        entry.face.style.display = hidden ? 'none' : '';
        if (!hidden && kind === 'chief') {
          place(entry.face, box.x1, box.y1, fs);
          entry.face.style.fontSize = (fs * 0.45) + 'px';
        } else if (!hidden) {
          place(entry.face, box.x2 - inset - fs, box.y1 + inset, fs);
          entry.face.style.fontSize = (fs * 0.6) + 'px';
        }
      }
      if (entry.spin) {
        // A stale or failed load knows nothing about what is running, so the
        // spinner goes rather than carrying on over a frozen tree.
        // The still marker claims nothing, so it stays on a stale page.
        var show = (entry.still || spinnersOn) && !hidden;
        entry.spin.style.display = show ? '' : 'none';
        if (show) {
          var ss = Math.max(8, Math.min(16, 12 * zoom));
          if (kind === 'agent') {
            // Against the robot's lower right, clear of the words beneath.
            place(entry.spin, box.x2 - ss * 0.6, box.y2 - ss * 0.9, ss);
          } else {
            place(entry.spin, box.x1 + w / 2 - ss / 2, box.y2 - inset - ss, ss);
          }
          entry.spin.style.borderWidth = Math.max(1.5, ss * 0.16) + 'px';
        }
      }
    });
  }

  function paintDeco() {
    if (cy === null) return;
    var key = decoSignature();
    if (key !== decoKey) {
      decoKey = key;
      buildDeco();
    }
    placeDeco();
  }

  function paint(data) {
    // Measured against this browser's own last successful load, never
    // against the server's clock. Comparing `Date.now()` to the host's
    // `generated_at` made the whole activity protection hostage to clock
    // skew: a phone a minute ahead of the host reads every fresh payload as
    // stale and never spins a card however hard the hive is working, and a
    // phone a minute behind keeps spinning after the data stopped arriving.
    lastGoodAt = Date.now();
    spinnersOn = true;
    var stamp = new Date(data.generated_at * 1000).toLocaleString();
    document.getElementById('cos-when').textContent = 'as of ' + stamp;

    var asks = document.getElementById('cos-asks');
    asks.innerHTML = data.questions.length
      ? data.questions.map(function (q) {
          return '<div class="cos-ask"><span class="who">' + esc(q.name) +
                 '</span>' + esc(q.question) + '</div>';
        }).join('')
      : '<p class="cos-empty">Nothing.</p>';

    var barrel = document.getElementById('cos-barrel');
    var barrelHtml = data.barrel.length
      ? data.barrel.map(function (d) {
          return '<div class="cos-done"><span class="k">' +
                 esc(d.work_kind || d.kind) + '</span><span>' +
                 esc(d.label) + '</span></div>';
        }).join('')
      : '<p class="cos-empty">Nothing yet.</p>';
    // Only when it changed: replacing the rows under a finger that is
    // swiping the barrel away detaches the element the touch started on,
    // and the rest of that swipe never reaches the barrel.
    if (barrelHtml !== lastBarrelHtml) {
      barrel.innerHTML = barrelHtml;
      lastBarrelHtml = barrelHtml;
    }

    var live = data.nodes.filter(function (n) { return n.kind === 'task'; });
    // Delegates still running. An orphaned card is drawn so its death is
    // visible, but it is not somebody working.
    var agents = data.nodes.filter(function (n) {
      return n.kind === 'agent' && n.status !== 'orphaned';
    });
    document.getElementById('cos-tasks').textContent = live.length;
    document.getElementById('cos-agents').textContent = agents.length;
    document.getElementById('cos-asks-n').textContent = data.questions.length;
    document.getElementById('cos-done').textContent = data.barrel.length;
    // Both done buttons, the top bar's and the graph corner's: whichever is
    // on screen shows the count.
    document.querySelectorAll('[data-done-count]').forEach(function (n) {
      n.textContent = data.barrel.length;
    });
    // The barrel holds finished stories only, so the bar is stories over
    // stories: finished ones against every story on the page.
    // One story counts once, however many tasks are on it.
    var liveStories = {};
    data.nodes.forEach(function (n) {
      if (n.work_kind === 'story' || n.work_kind === 'bug') {
        liveStories[n.board_item || n.id] = true;
      }
    });
    var total = Object.keys(liveStories).length + data.barrel.length;
    var pct = total ? Math.round((data.barrel.length / total) * 100) : 0;
    document.getElementById('cos-progress').style.width = pct + '%';
    document.getElementById('cos-pct').textContent = pct + '%';

    if (window.cytoscape) { draw(data); } else { pendingDraw = data; }
  }

  // ── the barrel, and what opening it does to the graph ────────────────
  // Safari before 14 has no addEventListener on a MediaQueryList. Unguarded
  // it throws here, and this line runs before the first load — so the page
  // would sit on "loading…" forever and never fetch anything at all.
  function listenMedia(query, handler) {
    if (query.addEventListener) { query.addEventListener('change', handler); }
    else if (query.addListener) { query.addListener(handler); }
  }

  var stage = document.getElementById('cos-stage');
  var pane = document.getElementById('cos-barrel-pane');
  // Two done buttons: the top bar's on a phone-size screen, the graph
  // corner's on a large one. CSS shows one; both say the same thing.
  var toggles = document.querySelectorAll('[data-barrel-toggle]');
  var mobile = window.matchMedia(MOBILE);

  function isOpen() { return stage.classList.contains('barrel-open'); }

  // The done button on screen right now — the top bar's or the graph's.
  function visibleToggle() {
    for (var i = 0; i < toggles.length; i++) {
      if (toggles[i].offsetParent !== null) return toggles[i];
    }
    return null;
  }

  // Docking hides the barrel; focus inside it would fall to the page body,
  // so it goes back to the done button that opened it.
  function dock() {
    var hadFocus = pane.contains(document.activeElement);
    setBarrel(false, true);
    var t = hadFocus && visibleToggle();
    if (t) t.focus({ preventScroll: true });
  }

  var memory = window.cosBarrelMemory;

  // `chosen` is every move Daniel makes — the done buttons, the close
  // control, Escape, a swipe, and opening the nav, which docks it. Only the
  // starting state applied on load or on crossing the breakpoint is not a
  // choice, and is never written back.
  function setBarrel(open, chosen) {
    stage.classList.toggle('barrel-open', open);
    if (chosen) memory.remember(open);
    toggles.forEach(function (t) {
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    // Cytoscape only measures its container on a window resize, so a panel
    // that changes the graph's width by a CSS class leaves the canvas
    // stretched and every tap landing on the wrong node. Told after the
    // transition, and immediately as well, so it is right either way.
    if (cy !== null) {
      cy.resize();
      window.setTimeout(function () { if (cy) { cy.resize(); paintDeco(); } }, 220);
    }
  }

  toggles.forEach(function (t) {
    t.addEventListener('click', function () {
      var open = !isOpen();
      setBarrel(open, true);
      // Over the page on a phone-size screen: the keyboard goes with it.
      if (open && mobile.matches) {
        pane.querySelector('[data-barrel-close]').focus({ preventScroll: true });
      }
      // The nav and the barrel are never open together on a phone: the
      // nav yields to the barrel, as the barrel yields to the nav.
      if (open) document.querySelector('[data-console-app]')
        .classList.remove('sidebar-open');
    });
    // The graph corner's button sits inside Cytoscape's container, whose
    // touch handlers cancel the tap — on a touch screen it did nothing at
    // all. Its touches stop at the button and never reach the graph.
    ['touchstart', 'touchmove', 'touchend', 'mousedown'].forEach(function (n) {
      t.addEventListener(n, function (e) { e.stopPropagation(); },
                         { passive: true });
    });
  });

  pane.querySelector('[data-barrel-close]').addEventListener('click', dock);

  // Escape docks an open barrel where it lies over the page.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mobile.matches && isOpen()) dock();
  });

  // Swiping the open barrel away docks it: a rightward swipe, towards the
  // edge it came in from, long enough and mostly sideways, so scrolling the
  // list never closes it. Touch only — a mouse dragging to select text is
  // not a swipe. Nothing anywhere opens on a swipe (DECIDED 2026-11-15).
  var SWIPE_MIN_PX = 60;
  var swipe = null;
  pane.addEventListener('touchstart', function (e) {
    swipe = (isOpen() && e.touches.length === 1)
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  pane.addEventListener('touchend', function (e) {
    if (swipe === null || !e.changedTouches.length) { swipe = null; return; }
    var t = e.changedTouches[0];
    var dx = t.clientX - swipe.x;
    var dy = t.clientY - swipe.y;
    swipe = null;
    // Phone-size only, where the barrel lies over the page: in a large
    // screen's layout a sideways drag on the list is not a way out, and it
    // would be remembered as a choice.
    if (mobile.matches && dx >= SWIPE_MIN_PX && dx > Math.abs(dy) * 1.5) dock();
  }, { passive: true });
  pane.addEventListener('touchcancel', function () { swipe = null; },
                        { passive: true });

  // The starting state for this size of screen: its remembered choice, else
  // docked on a phone and open on a large screen. Re-decided when the
  // viewport crosses the breakpoint, so a rotated phone or a resized window
  // takes the state remembered for the size it now is.
  function applyStart() {
    var hadFocus = pane.contains(document.activeElement);
    var open = memory.start();
    setBarrel(open, false);
    var t = !open && hadFocus && visibleToggle();
    if (t) t.focus({ preventScroll: true });
  }
  listenMedia(mobile, applyStart);
  applyStart();

  // The nav docks the barrel when it opens, through the real setter rather
  // than by stripping the class, so aria-expanded cannot be left saying
  // "true" on a closed barrel.
  document.addEventListener('hive:close-push-panels', function () {
    setBarrel(false, true);
  });

  window.addEventListener('resize', function () {
    if (cy !== null) { cy.resize(); paintDeco(); }
  });

  // ── wheel zoom ──────────────────────────────────────────────────────
  // Cytoscape's own wheel zoom multiplies by about two and a half per mouse
  // notch, so the level Daniel wants sits between two ticks and cannot be
  // reached. The page zooms on the wheel itself instead: about four percent
  // a notch, and the same step back out, so a notch in and a notch out land
  // where they started (except where minZoom or maxZoom clamped the first).
  // Touch pinch on a phone is left to Cytoscape - it follows the fingers,
  // which is already as fine as the hand moving them.
  //
  // One notch is about 100 pixels of deltaY in Chrome and Edge and 3 lines
  // in Firefox, so a line counts as 33 pixels. A trackpad sends many small
  // pixel deltas and is proportional by construction. A trackpad pinch
  // arrives in Chrome and Firefox as ctrl + wheel with deltas a tenth the
  // size, so it is scaled up to match. Safari's pinch is a gesture event,
  // left to Cytoscape, and follows the fingers as a phone's does. Any
  // single event is capped at one notch, so a wheel that reports 120 or a
  // page-mode delta never jumps further than one step.
  var WHEEL_NOTCH_PX = 100;
  var WHEEL_LINE_PX = 33;
  var WHEEL_PINCH_GAIN = 10;
  // log2 of the per-notch factor: 2 ** 0.06 is about 1.042.
  var WHEEL_STEP_LOG2 = 0.06;

  function wheelPixels(e) {
    var dy = e.deltaY;
    if (e.deltaMode === 1) dy *= WHEEL_LINE_PX;
    else if (e.deltaMode === 2) dy *= WHEEL_NOTCH_PX;
    if (e.ctrlKey) dy *= WHEEL_PINCH_GAIN;
    return Math.max(-WHEEL_NOTCH_PX, Math.min(WHEEL_NOTCH_PX, dy));
  }

  // A wheel that arrives while the page itself is scrolling is the page
  // scroll carrying on under the pointer, not a request to zoom - the same
  // allowance Cytoscape's own handler makes, so the graph does not trap a
  // scroll on its way past to "Waiting on you".
  var PAGE_SCROLL_GRACE_MS = 250;
  var pageScrolledAt = 0;
  window.addEventListener('scroll', function () {
    pageScrolledAt = Date.now();
  }, { passive: true });

  // On the stage and in the capture phase, so it runs before Cytoscape's
  // own capture listener on #cos-cy. Not passive, or preventDefault is
  // ignored and ctrl + wheel zooms the browser too. Wheel over the barrel's
  // list still scrolls it: only a vertical wheel over the graph zooms.
  document.getElementById('cos-stage').addEventListener('wheel', function (e) {
    var graph = document.getElementById('cos-cy');
    if (cy === null || !graph.contains(e.target)) return;
    // Cytoscape never sees a wheel, whatever happens next: let through, its
    // handler would zoom by its own coarse step whenever this one stood
    // aside. Standing aside means leaving the default alone, so a sideways
    // scroll or a page scroll still moves the page.
    e.stopPropagation();
    // A sideways swipe is rarely exactly sideways, so "mostly" is enough.
    if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    var px = wheelPixels(e);
    // Not for a pinch: let through, ctrl + wheel would zoom the browser.
    if (!e.ctrlKey && Date.now() - pageScrolledAt < PAGE_SCROLL_GRACE_MS) {
      return;
    }
    e.preventDefault();
    // Not mid-drag, mid-pan or mid-box-select, which Cytoscape also refused.
    if (!cy.userZoomingEnabled() || e.buttons !== 0 ||
        cy.nodes(':grabbed').length) return;
    var box = graph.getBoundingClientRect();
    cy.zoom({
      level: cy.zoom() * Math.pow(2, -px / WHEEL_NOTCH_PX * WHEEL_STEP_LOG2),
      renderedPosition: { x: e.clientX - box.left - graph.clientLeft,
                          y: e.clientY - box.top - graph.clientTop }
    });
  }, { capture: true, passive: false });

  // ── loading ─────────────────────────────────────────────────────────
  var inFlight = false;
  var sequence = 0;

  function load() {
    // One at a time. Two overlapping fetches can answer out of order and
    // paint the older tree last, which on this page means showing work as
    // running after it stopped.
    if (inFlight) return;
    inFlight = true;
    var mine = ++sequence;
    var abort = new AbortController();
    var timer = window.setTimeout(function () { abort.abort(); },
                                  FETCH_TIMEOUT_MS);
    fetch('/api/chief-of-staff', { credentials: 'same-origin',
                                   signal: abort.signal })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (data) {
        if (mine !== sequence) return;
        paint(data);
      })
      .catch(function (err) {
        // A page that cannot read the hive knows nothing about what is
        // running, so it stops claiming anything is.
        spinnersOn = false;
        paintDeco();
        document.getElementById('cos-when').innerHTML =
          '<span class="cos-error">' +
          esc(err.name === 'AbortError' ? 'the hive did not answer' : err.message) +
          '</span>';
      })
      .finally(function () {
        window.clearTimeout(timer);
        inFlight = false;
      });
  }

  // A load that keeps failing leaves the last tree on screen; this is what
  // stops that tree going on claiming work is running.
  function checkStale() {
    var stale = lastGoodAt !== 0 &&
                (Date.now() - lastGoodAt) > STALE_AFTER_MS;
    if (stale && spinnersOn) {
      spinnersOn = false;
      paintDeco();
      document.getElementById('cos-when').innerHTML =
        '<span class="cos-stale">stale — the hive has not answered</span>';
    }
  }

  load();
  setInterval(load, REFRESH_MS);
  setInterval(checkStale, 5000);
})();
</script>
{% endblock %}
