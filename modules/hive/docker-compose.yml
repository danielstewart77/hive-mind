# The project name is pinned: the directory is modules/hive inside hive-mind,
# and a project named after any other directory would not be the one the
# running console belongs to. Container name, port and network are unchanged.
name: hive

services:
  hive:
    build:
      context: .
      additional_contexts:
        # The access layer is hive-mind's own modules/hive-data, a second
        # build context. Relative to this file, so a fresh checkout builds
        # with no sibling folder. A HIVE_DATA_DIR left in .env is ignored.
        hive_data: ../hive-data
    container_name: hive-site
    restart: unless-stopped
    ports:
      - "8710:8710"
    env_file: .env
    environment:
      - HIVE_HOST=0.0.0.0
      - HIVE_LOG_FORMAT=json
      # The hive's one Postgres, through `hive_data`. Required: the console
      # refuses to start without it.
      - HIVE_DATABASE_URL=${HIVE_DATABASE_URL:?set HIVE_DATABASE_URL in .env}
      # Parent domain so the session cookie is shared with the terminal
      # site, which reads the same accounts and secret.
      - HIVE_COOKIE_DOMAIN=sparktobloom.com
      # Who the Capability Nodes clone action hands its checkout to. This
      # container runs as root, so without it every cloned file lands
      # root-owned on the host and the operator hits git's dubious-ownership
      # refusal on their own repository. Matching the mount point instead is
      # not enough: when the destination does not exist yet, Docker creates
      # the bind source root-owned, and there is nothing to match.
      - HOST_UID=${HOST_UID:-1000}
      - HIVE_KEY_ROOT=/mind_keys
      - HIVE_MIND_UID=${HIVE_MIND_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      # Every path below that names the host defaults to somewhere inside this
      # checkout (or the operator's home), never to a folder of one person's
      # machine. A machine that keeps the minds, the edge minds' folders or
      # the development tree elsewhere says so in this folder's .env:
      # HIVE_MIND_DIR (the install's minds/ and .env files; default is the
      # checkout), HOST_DEV_DIR (default an empty folder: the whole checkout holds .env files and is not offered), SKIPPY_DIR and MORDECAI_DIR (an edge mind's
      # checkout; unset, nothing is there and the console shows none),
      # INFERENCE_PROXY_DIR, HIVE_INIT_DIR.
      - ./src:/app/src
      # The modules shared with the terminal site, live like ./src above.
      # The terminal mounts this same directory from its own compose.
      - ./hive_site:/app/hive_site
      # Canvas state, harness runs and .env backups.
      - ./data:/data
      # Per-mind config files for the /settings mind registry and the
      # per-Mind default-model editor. Containerized minds
      # (ada/bob/bilby/nagatha/hex-bot) keep runtime.yaml under hive_mind's
      # minds/. Remote minds (arnold, zach, hex) have no local file here.
      - ${HIVE_MIND_DIR:-../..}/minds:/minds_hive_mind:ro
      # Edge minds installed on this host keep their own runtime.yaml in
      # their hive-edge-minds checkout. Mounted per mind at its own name so
      # /minds_edge/<name>/runtime.yaml is uniform with the mount above, and
      # read-only: configuration is written through each Mind's own
      # PATCH /runtime API, which is the one path that also reaches a Mind
      # on another machine. These mounts are for display and for registering
      # a Mind that has never started.
      - ${SKIPPY_DIR:-./data/no-edge/skippy}/minds/skippy:/minds_edge/skippy:ro
      - ${MORDECAI_DIR:-./data/no-edge/mordecai}/minds/mordecai:/minds_edge/mordecai:ro
      # Same hive_mind minds/ dir, read-write, scoped to voice_ref.wav
      # uploads only (see api_settings_voice_upload) — kept as a second
      # mount rather than loosening the read-only one above, so the
      # blast radius of "settings can write files" stays legible in code.
      - ${HIVE_MIND_DIR:-../..}/minds:/minds_hive_mind_voice:rw
      - ${HIVE_MIND_DIR:-../..}/minds:/minds_hive_mind_config:rw
      # Each mind's key, one folder per mind, OUTSIDE the checkout every mind
      # mounts: written here and only here (requirement 21); a mind mounts its
      # own folder read-only. HOST_KEY_DIR is the same folder in .env.
      - ${HOST_KEY_DIR:-./data/mind-keys}:/mind_keys:rw
      # The mountable roots for the per-Mind project folders control
      # (mind_mounts.py). Read-write because the control creates a folder and
      # mounts it in one action; what it may reach is this mount, so a root
      # added to MIND_MOUNT_ROOTS needs its own mount here and a recreate.
      - ${HOST_DEV_DIR:-./data/dev-roots}:/dev_roots:rw
      # (see the HOST_UID/HOST_GID note in the environment block above)
      # hive-mind's own copy of the tools service (modules/hive-tools), read
      # only: the console shows what it offers and never writes it. Relative
      # to this file, so a fresh checkout resolves it on any OS. A
      # HIVE_TOOLS_DIR left in .env is ignored. Tools' .env is not mounted
      # here: it lives outside the checkout (docker-compose.yml of the tools).
      - ../hive-tools:/hive_tools_repo:ro
      # Hive-init installer assets, read-only, served from the downloads tab.
      - ${HIVE_INIT_DIR:-../../installer}:/hive_init:ro
      # Fixed destination used by the Capability Nodes one-click clone action.
      - ${INFERENCE_PROXY_DIR:-../inference-proxy}:/inference_proxy_repo:rw
      # Shared-secret .env files for the /settings credentials tab. Each is
      # bind-mounted as a single file, read-write, so rotation can write a
      # new value in place — see credentials_data.py for which key lives in
      # which file and why they must move together.
      - ${HIVE_MIND_DIR:-../..}/nervous-system/.env:/env_nervous_system/.env:rw
      - ${HIVE_MIND_DIR:-../..}/.env:/env_hive_mind/.env:rw
      - ${SKIPPY_DIR:-./data/no-edge/skippy}/.env:/env_edge/skippy/.env:rw
      - ${MORDECAI_DIR:-./data/no-edge/mordecai}/.env:/env_edge/mordecai/.env:rw
      - ${HIVE_TOOLS_STATE_DIR:-${HOME}/.config/hive-tools}/.env:/env_hive_tools/.env:rw
      # The GitHub PAT's two live homes, for the same tab's paste-to-set flow.
      - ${GIT_CREDENTIALS_FILE:-${HOME}/.git-credentials}:/gh/.git-credentials:rw
      - ${GH_HOSTS_FILE:-${HOME}/.config/gh/hosts.yml}:/gh/hosts.yml:rw
    networks:
      - hivemind
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  hivemind:
    external: true
    name: hivemind
